<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>TimosApp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f2f4f8;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --accent-press: #3a6fd8;
    --done: #38c172;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 20px 20px 8px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .3px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 16px 20px;
  }
  .timer {
    width: 100%;
    max-width: 340px;
    background: var(--card);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
  }
  .timer-label { color: var(--muted); font-size: 15px; margin-bottom: 14px; }
  .timer-value {
    font-variant-numeric: tabular-nums;
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 1px;
  }
  .timer-value.done { color: var(--done); }
  button {
    width: 100%;
    max-width: 340px;
    border: none;
    border-radius: 18px;
    padding: 20px;
    font-size: 19px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
    transition: background .15s;
  }
  button:active { background: var(--accent-press); }
  button.secondary { background: #2a2f3a; color: var(--text); }
  button:disabled { opacity: .6; }
  nav {
    display: flex;
    border-top: 1px solid #232733;
  }
  nav a {
    flex: 1;
    text-align: center;
    padding: 14px 0 18px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
  }
  nav a.active { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <header>TimosApp</header>

  <main>
    <div class="timer">
      <div class="timer-label" id="label">Wäsche · 2:35 Std.</div>
      <div class="timer-value" id="value">2:35:00</div>
    </div>
    <button id="action">Wäsche starten</button>
  </main>

  <nav>
    <a href="#" class="active">Wäsche</a>
  </nav>

<script>
  const DURATION_MS = (2 * 60 + 35) * 60 * 1000; // 2:35 Std.
  const KEY = "waesche.end";
  const NOTIFIED = "waesche.notified";

  const labelEl = document.getElementById("label");
  const valueEl = document.getElementById("value");
  const actionEl = document.getElementById("action");

  let ticker = null;
  let endTime = Number(localStorage.getItem(KEY)) || 0;

  function fmt(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const h = String(Math.floor(total / 3600)).padStart(2, "0");
    const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
    const s = String(total % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }

  async function getRegistration() {
    if (!("serviceWorker" in navigator)) return null;
    try {
      return await navigator.serviceWorker.ready;
    } catch {
      return null;
    }
  }

  async function notify() {
    const title = "Wäsche fertig";
    const body = "Die 2:35 Stunden sind um.";
    const reg = await getRegistration();
    if (reg) {
      reg.showNotification(title, { body, icon: "icon-192.png", vibrate: [200, 100, 200, 100, 400], tag: "waesche" });
    } else if ("Notification" in window && Notification.permission === "granted") {
      new Notification(title, { body, icon: "icon-192.png" });
    }
  }

  async function requestPermission() {
    if (!("Notification" in window)) return;
    if (Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch {}
    }
  }

  function clearTimer() {
    if (ticker) { clearInterval(ticker); ticker = null; }
  }

  function renderIdle() {
    endTime = 0;
    localStorage.removeItem(KEY);
    localStorage.removeItem(NOTIFIED);
    labelEl.textContent = "Wäsche · 2:35 Std.";
    valueEl.textContent = fmt(DURATION_MS);
    valueEl.classList.remove("done");
    actionEl.textContent = "Wäsche starten";
    actionEl.classList.remove("secondary");
  }

  function renderRunning() {
    labelEl.textContent = "Wäsche läuft";
    valueEl.classList.remove("done");
    actionEl.textContent = "Abbrechen";
    actionEl.classList.add("secondary");
  }

  function renderDone() {
    clearTimer();
    valueEl.textContent = "00:00:00";
    valueEl.classList.add("done");
    labelEl.textContent = "Wäsche fertig";
    actionEl.textContent = "Zurücksetzen";
    actionEl.classList.remove("secondary");
  }

  function tick() {
    const remaining = endTime - Date.now();
    if (remaining <= 0) {
      if (localStorage.getItem(NOTIFIED) !== String(endTime)) {
        localStorage.setItem(NOTIFIED, String(endTime));
        notify();
      }
      renderDone();
      return;
    }
    valueEl.textContent = fmt(remaining);
  }

  function start() {
    endTime = Date.now() + DURATION_MS;
    localStorage.setItem(KEY, String(endTime));
    localStorage.removeItem(NOTIFIED);
    clearTimer();
    ticker = setInterval(tick, 1000);
    renderRunning();
    tick();
  }

  function reset() {
    clearTimer();
    renderIdle();
  }

  actionEl.addEventListener("click", () => {
    if (endTime && endTime > Date.now()) {
      reset();
    } else if (endTime) {
      reset();
    } else {
      requestPermission();
      start();
    }
  });

  function resume() {
    if (!endTime) { renderIdle(); return; }
    if (endTime - Date.now() > 0) {
      clearTimer();
      ticker = setInterval(tick, 1000);
      renderRunning();
      tick();
    } else {
      renderDone();
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) resume();
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  resume();
</script>
</body>
</html>
